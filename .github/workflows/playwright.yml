name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 22 * * *' # daily check of the live site
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest moved to Ubuntu 26, which this Playwright version can't install browsers on yet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
